services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: movie_catalog
      MYSQL_USER: film_catalog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD no arquivo .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    build: ./Backend
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: film_catalog
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD no arquivo .env}
      DB_DATABASE: movie_catalog
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "db/migrate.js"]
    restart: "no"

  backend:
    build: ./Backend
    environment:
      HOST: 0.0.0.0
      BIND_TO_CONTAINER_NETWORK: "1"
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: film_catalog
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD no arquivo .env}
      DB_DATABASE: movie_catalog
      CATALOG_SOURCE: ${CATALOG_SOURCE:-demo}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/favorites/ids', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build: ./Frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mysql_data:
